<!doctype html>
<html
  lang="zh-CN"
  th:lang="${#locale.toLanguageTag}"
  xmlns:th="http://www.thymeleaf.org"
>
  <head
    th:replace="~{modules/head :: head(title=${author.spec.displayName + ' - ' + site.title}, description=${author.spec.bio}, type='profile', image=${author.spec.avatar ?: site.logo}, url=${site.url + author.status.permalink})}"
  ></head>
  <body>
    <div th:replace="~{modules/header :: header}"></div>
    <main class="shell">
      <header class="page-head">
        <p class="section-code" th:text="#{author.code}">AUTHOR / 作者</p>
        <div class="author-head">
          <img
            class="author-avatar"
            th:if="${not #strings.isEmpty(author.spec.avatar)}"
            th:src="${author.spec.avatar}"
            th:alt="${author.spec.displayName}"
          />
          <div
            class="author-avatar author-avatar-fallback"
            th:unless="${not #strings.isEmpty(author.spec.avatar)}"
            th:text="${#strings.isEmpty(author.spec.displayName) ? 'A' : #strings.substring(author.spec.displayName, 0, 1)}"
          ></div>
          <div>
            <h1 class="page-title" th:text="${author.spec.displayName}">作者</h1>
            <p
              class="page-desc"
              th:if="${not #strings.isEmpty(author.spec.bio)}"
              th:text="${author.spec.bio}"
            ></p>
          </div>
        </div>
        <p class="page-meta">
          <span th:text="${posts.total}">0</span>
          <span th:text="#{index.articles}">文章</span>
        </p>
      </header>

      <div class="list-block">
        <th:block th:each="post, iter : ${posts.items}">
          <article
            th:replace="~{modules/post-row :: row(post=${post}, index=${iter.count})}"
          ></article>
        </th:block>
        <p
          class="empty"
          th:if="${#lists.isEmpty(posts.items)}"
          th:text="#{index.empty}"
        ></p>
        <div th:replace="~{modules/pagination :: pager(posts=${posts})}"></div>
      </div>
    </main>
    <div th:replace="~{modules/footer :: footer}"></div>
    <script
      th:src="@{/assets/js/app.js?v={v}(v=${theme.spec.version})}"
      defer
    ></script>
  </body>
</html>
