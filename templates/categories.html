<!doctype html>
<html
  lang="zh-CN"
  th:lang="${#locale.toLanguageTag}"
  xmlns:th="http://www.thymeleaf.org"
>
  <head
    th:replace="~{modules/head :: head(title=${#messages.msg('categories.title') + ' - ' + site.title}, description=null, type='website', image=${site.logo}, url=${site.url + site.routes.categoriesUri})}"
  ></head>
  <body>
    <div th:replace="~{modules/header :: header}"></div>
    <main class="shell">
      <header class="page-head">
        <p class="section-code" th:text="#{categories.code}">TAXONOMY / 分类</p>
        <h1 class="page-title" th:text="#{categories.title}">分类</h1>
        <p class="page-meta">
          <span th:text="${#lists.size(categories)}">0</span>
          <span th:text="#{categories.title}">分类</span>
        </p>
      </header>

      <div class="taxonomy-grid">
        <article
          class="cat-card"
          th:each="category, iter : ${categories}"
        >
          <div class="cat-card-top">
            <span
              class="cat-index"
              th:text="|#${#numbers.formatInteger(iter.count, 2)}|"
            ></span>
            <span class="badge" th:text="${category.postCount}">0</span>
          </div>
          <h2>
            <a
              th:href="@{${category.status.permalink}}"
              th:text="${category.spec.displayName}"
            ></a>
          </h2>
          <p
            class="cat-desc"
            th:if="${not #strings.isEmpty(category.spec.description)}"
            th:text="${category.spec.description}"
          ></p>
          <ul class="cat-children" th:if="${not #lists.isEmpty(category.children)}">
            <li th:each="child : ${category.children}">
              <a th:href="@{${child.status.permalink}}">
                <span th:text="${child.spec.displayName}"></span>
                <span class="side-count" th:text="${child.postCount}"></span>
              </a>
            </li>
          </ul>
        </article>
      </div>

      <p
        class="empty"
        th:if="${#lists.isEmpty(categories)}"
        th:text="#{index.empty}"
      ></p>
    </main>
    <div th:replace="~{modules/footer :: footer}"></div>
    <script
      th:src="@{/assets/js/app.js?v={v}(v=${theme.spec.version})}"
      defer
    ></script>
  </body>
</html>
